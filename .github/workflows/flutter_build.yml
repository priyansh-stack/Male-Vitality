name: Male Vitality APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Analyze code
        continue-on-error: true
        run: flutter analyze
      
      - name: Run tests
        run: flutter test
      
      - name: Configure Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | base64 --decode > /dev/null 2>&1 && [[ "$(echo "$GOOGLE_SERVICES_JSON" | base64 --decode 2>/dev/null)" == *"project_info"* ]]; then
              echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
              echo "Decoded base64 GOOGLE_SERVICES_JSON"
            else
              echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              echo "Wrote raw JSON GOOGLE_SERVICES_JSON"
            fi
          elif [ -f "android/app/google-services.json" ] && grep -q "project_id" android/app/google-services.json; then
            echo "Using existing repository android/app/google-services.json"
          fi
      
      - name: Fix minSdkVersion for health plugin
        run: |
          echo "Updating minSdkVersion in build.gradle.kts..."
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
            echo "Current minSdk:"
            grep -i "minSdk" android/app/build.gradle.kts || echo "Not found"
            
            # Update minSdk from flutter.minSdkVersion to 26
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle.kts
            
            echo "Updated minSdk:"
            grep -i "minSdk" android/app/build.gradle.kts || echo "Not found"
            echo "Successfully updated minSdkVersion to 26"
          else
            echo "build.gradle.kts not found!"
            ls -la android/app/
            exit 1
          fi
      
      - name: Build Release APK
        run: flutter build apk --release
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Male-Vitality-Release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30